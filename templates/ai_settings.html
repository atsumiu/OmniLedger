<!doctype html>

<html>

<head>

  <meta charset="utf-8">

  <title>AI Settings - OmniLedger</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

</head>

<body>

<div class="dashboard-container">

  <aside class="sidebar">

    <div class="user-profile"><div class="profile-image">👤</div><p class="hello-text">Hello!</p><h3>{{ session['name'] }}</h3></div>

    <nav class="sidebar-menu">


      <a href="{{ url_for('dashboard') }}">
        Dashboard
      </a>

      <a href="{{ url_for('statistics') }}">
        Statistics
      </a>

      <a href="{{ url_for('reports') }}">
        Reports
      </a>

      <a href="{{ url_for('add_property') }}">
        Properties
      </a>
      
      <a href="{{ url_for('ai_analytics') }}">
        AI Analytics
      </a>

      <hr>

      <a href="{{ url_for('logout') }}">
        Log Out
      </a>

      <a href="{{ url_for('help_page') }}" class="active">
        Help
      </a>

    </nav>

  </aside>


  <main class="main-content" style="padding:24px">

    <h2>AI Settings</h2>

    {% if message %}<div class="alert">{{ message }}</div>{% endif %}

    <form method="post">

      <div style="margin-bottom:8px">

        <label>OpenAI API Key</label><br>

        <input type="password" name="openai_key" style="width:420px;padding:8px" placeholder="sk-...">

      </div>

      <div style="display:flex;gap:8px;">

        <button type="submit" name="save" class="btn">Save Key</button>

        <button type="submit" name="remove" class="btn">Remove Key</button>

      </div>

    </form>

    <p style="margin-top:12px">Current: <strong>{{ 'Set' if current else 'Not set' }}</strong></p>

  </main>

</div>

</body>

</html>
